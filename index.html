<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090c15"><meta name="description" content="MovieBox Web — your personal media dashboard"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>MovieBox Web</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="app"><aside class="sidebar"><a class="brand" href="#home"><span class="brand-mark">▶</span><span>moviebox<span class="brand-dot">.</span><small>WEB EDITION</small></span></a><div class="sidebar-label">DISCOVER</div><nav id="desktop-nav"><button data-route="home" class="nav-item active"><span>⌂</span> Home</button><button data-route="library" class="nav-item"><span>▤</span> My Library</button><button data-route="live" class="nav-item"><span>▣</span> Live TV</button><button data-route="favorites" class="nav-item"><span>♡</span> Favorites</button></nav><div class="sidebar-label extra">YOUR SPACE</div><nav><button data-route="history" class="nav-item"><span>◷</span> Recently Played</button><button data-route="settings" class="nav-item"><span>⚙</span> Settings</button></nav><div class="side-bottom"><span class="pulse"></span> Private on this device <small>Media you add stays in your browser</small></div></aside>
<div class="main"><header class="topbar"><div class="breadcrumbs">YOUR ENTERTAINMENT <span>/</span> <strong id="page-crumb">HOME</strong></div><div class="top-actions"><label class="search"><span>⌕</span><input id="search" autocomplete="off" placeholder="Search your collection..."><kbd>/</kbd></label><button class="circle-btn" id="add-top" title="Add media">＋</button><div class="avatar">M</div></div></header>
<main id="content" class="content"></main><footer class="footer">MovieBox Web · Personal media hub · Based on UI concepts from MovieBox-TUI <a target="_blank" rel="noopener" href="https://github.com/mesamirh/MovieBox-Tui">View original project ↗</a></footer></div></div>
<nav class="bottom-nav"><button data-route="home" class="active"><span>⌂</span>Home</button><button data-route="library"><span>▤</span>Library</button><button data-route="live"><span>▣</span>Live TV</button><button data-route="favorites"><span>♡</span>Saved</button><button data-route="settings"><span>⚙</span>More</button></nav>
<div id="modal-layer" class="modal-layer hidden" role="presentation"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title">Add to your collection</h2><button id="close-dialog" class="icon-button" aria-label="Close">✕</button></div><div id="dialog-body"></div></div></div>
