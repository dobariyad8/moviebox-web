name: Frontend JavaScript syntax
on:
  push:
    paths:
      - '*.js'
      - '.github/workflows/frontend-check.yml'
  pull_request:
    paths:
      - '*.js'
      - '.github/workflows/frontend-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --check discover.js
      - run: node --check live-tv.js
      - run: node --check tv-guide.js
      - run: node --check sw.js
      - run: node --check pwa.js
      - run: node --check account.js
      - run: node --check cloud-sync.js
